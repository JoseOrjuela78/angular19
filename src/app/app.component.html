
<!-- src/app/components/toast-container/toast-container.component.html -->
 
<app-loading/>
<div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1200">
  <div
    *ngFor="let toast of toastService.getToasts()"
    class="toast show align-items-center text-white border-0 mb-2"
    [ngClass]="toast.classname"
    role="alert"
    aria-live="assertive"
    aria-atomic="true"
    [attr.data-bs-delay]="toast.delay"
  >
    <div class="d-flex">
      <div class="toast-body">
        {{ toast.text }}
      </div>
      <button
        type="button"
        class="btn-close btn-close-white me-2 m-auto"
        (click)="toastService.remove(toast)"
        aria-label="Close"
      ></button>
    </div>
  </div>
</div>
<router-outlet/>
